name: Publish site

# Builds the DFW opportunity intelligence data, freezes the public site and publishes it to
# GitHub Pages at https://daveok16-arch.github.io/research-lab/.
#
# The intelligence layer runs here rather than in the browser: Pages serves static files, so the
# data is collected, scored and assembled in the runner, then exported as HTML and pushed to the
# `gh-pages` branch that Pages publishes from.
#
# Triggers:
#   - push to main      — republish whenever the code changes
#   - schedule          — daily refresh so the published data does not go stale
#   - workflow_dispatch — manual run with a bounded or full ingest

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Pages per source (empty = connector default)"
        required: false
        default: ""
      full:
        description: "Full ingest of every page of every source"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One publisher at a time; a newer run supersedes a queued one but never cancels a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          PYTHONPATH: src
          SECRET_KEY: ci-not-a-secret
        run: python -m pytest tests/ -q

      - name: Initialise schema
        env:
          PYTHONPATH: src
        run: |
          python -m oppintel.cli initdb
          python -m flask --app oppintel.app.wsgi init-app

      - name: Ingest permits
        env:
          PYTHONPATH: src
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            python -m oppintel.cli ingest
          elif [ -n "${{ github.event.inputs.max_pages }}" ]; then
            python -m oppintel.cli ingest --max-pages "${{ github.event.inputs.max_pages }}"
          else
            # Connectors paginate newest-first, so a bounded fetch keeps the published site
            # current without pulling the full multi-hundred-thousand-row backlog every run.
            python -m oppintel.cli ingest --max-pages 3
          fi

      - name: Assemble projects and detect changes
        env:
          PYTHONPATH: src
        run: python -m oppintel.cli assemble

      - name: Build search index
        env:
          PYTHONPATH: src
        run: python -m flask --app oppintel.app.wsgi build-search-index

      - name: Raise alerts from detected changes
        env:
          PYTHONPATH: src
        run: python -m flask --app oppintel.app.wsgi monitor

      - name: Export the static site
        env:
          PYTHONPATH: src
          SECRET_KEY: ci-not-a-secret
        run: |
          python ops/export_static.py \
            --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            --out dist --strict

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Publishing writes the gh-pages branch, so this job needs write access the build job does not.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Push the export to gh-pages
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Publish site from ${GITHUB_SHA::7}"
          # The branch is generated content rebuilt from scratch each run, so it is replaced
          # rather than appended to.
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published to https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
