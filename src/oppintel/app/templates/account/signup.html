{% extends "base.html" %}

{% block content %}
<section class="section">
  <div class="form-card">
    <h1 style="font-size:1.3rem">Create a free account</h1>
    <p class="muted small">
      Save opportunities and set your market and trade preferences. No payment details are
      requested and none are stored.
    </p>
    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
    <form method="post">
      <div class="field">
        <label for="display_name">Name (optional)</label>
        <input type="text" id="display_name" name="display_name" autocomplete="name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="new-password">
        <span class="form-help">At least 8 characters.</span>
      </div>
      <div class="field">
        <label for="password_confirm">Confirm password</label>
        <input type="password" id="password_confirm" name="password_confirm" required autocomplete="new-password">
      </div>
      <button class="btn btn-primary" type="submit">Create account</button>
    </form>
    <p class="small muted" style="margin-top:14px">
      Already registered? <a href="{{ url_for('signin') }}">Sign in</a>.
    </p>
  </div>
</section>
{% endblock %}
